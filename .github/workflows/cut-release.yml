# Manual release with an explicit version, for when you want a specific
# number instead of the auto-bumped one. Based on KVG_Standards'
# templates/cut-release.yml.

name: Cut Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. "1.2.3" or "v1.2.3"'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate and normalize version
        id: version
        env:
          RAW: ${{ inputs.version }}
        run: |
          set -e
          VERSION="v${RAW#v}"
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: '$RAW', expected X.Y.Z or vX.Y.Z (e.g. 1.2.3)." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  release:
    needs: version
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.version.outputs.version }}
    permissions:
      contents: write
